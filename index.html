  ${m==='criar'?'<h3 style="font-size:17px;margin-bottom:12px">Criar conta</h3><label class="field"><span>Seu nome</span><input id="lgNome" autocomplete="name" value="'+esc(LG.nome||'')+'"></label>':''}
  <label class="field"><span>E-mail</span><input id="lgEmail" type="email" autocomplete="email" inputmode="email" value="${esc(LG.email)}"></label>
  ${m!=='reset'?`<label class="field"><span>Senha</span><input id="lgSenha" type="password" autocomplete="${m==='criar'?'new-password':'current-password'}"></label>`:''}
  ${m==='criar'?'<label class="field"><span>Confirmar senha</span><input id="lgSenha2" type="password" autocomplete="new-password"></label>':''}
  <button class="btn block" data-act="lgEnviar" ${LG.busy?'disabled':''}>${LG.busy?'Aguarde…':{entrar:'Entrar',criar:'Criar conta',reset:'Enviar link de redefinição'}[m]}</button>
  <div class="login-links">${m==='entrar'?'<button data-act="lgModo" data-arg="criar">Criar conta</button><button data-act="lgModo" data-arg="reset">Esqueci a senha</button>':'<button data-act="lgModo" data-arg="entrar">Voltar para entrar</button>'}</div>
 </div>`;
}
function showLogin(st){if(st)LG.st=st;const el=$('#login');el.hidden=false;el.innerHTML=`<div class="login-box">${loginHTML(LG.st)}</div>`}
function hideLogin(){$('#login').hidden=true;$('#login').innerHTML=''}
const AUTH_ERR={'auth/invalid-credential':'E-mail ou senha incorretos.','auth/wrong-password':'E-mail ou senha incorretos.','auth/user-not-found':'Não existe conta com este e-mail.','auth/invalid-login-credentials':'E-mail ou senha incorretos.','auth/email-already-in-use':'Já existe uma conta com este e-mail. Entre com a senha ou com o Google.','auth/weak-password':'Use uma senha com pelo menos 6 caracteres.','auth/invalid-email':'Digite um e-mail válido.','auth/missing-password':'Digite a senha.','auth/network-request-failed':'Sem conexão com a internet.','auth/too-many-requests':'Muitas tentativas. Aguarde alguns minutos e tente de novo.','auth/unauthorized-domain':'Este endereço não está autorizado no Firebase. Adicione o domínio em Authentication > Configurações > Domínios autorizados.','auth/operation-not-allowed':'Este tipo de login não está ativado no Firebase (Authentication > Método de login).','auth/account-exists-with-different-credential':'Este e-mail já usa outro tipo de login. Entre com e-mail e senha.','auth/user-disabled':'Esta conta foi desativada.'};
function lgErro(e){if(['auth/popup-closed-by-user','auth/cancelled-popup-request'].includes(e?.code)){LG.busy=false;showLogin('form');return}LG.err=AUTH_ERR[e?.code]||('Não foi possível entrar'+(e?.code?` (${e.code})`:'')+'.');LG.busy=false;showLogin(LG.st==='verificar'?'verificar':'form')}
async function onUser(u){
 if(!u){CLOUD.user=null;stopSync();pararAcesso();setCloud('off');LG.busy=false;showLogin('form');return}
 if(u.providerData.some(p=>p.providerId==='password')&&!u.emailVerified){showLogin('verificar');return}
 CLOUD.user=u;LG.err=LG.ok='';LG.busy=false;
 showLogin('carregando');
 let ok=false;
 try{ok=await verificarAcesso(u)}catch(e){
  console.error(e);
  if(e.code==='permission-denied'){showLogin('semacesso');return}
  if(lmeta().membro===eu())ok=true;else{showLogin('erro');return}
 }
 if(!ok)return;
 setMeta({membro:eu()});
 if(await startSync()){hideLogin();iniciarAcesso();render()}
}
async function fbInit(){
 if(!FB_ON){setCloud('off');return}
 showLogin('carregando');
 try{
  const v='10.12.2',base=`https://www.gstatic.com/firebasejs/${v}/`;
  await loadScript(base+'firebase-app-compat.js');
  await Promise.all([loadScript(base+'firebase-auth-compat.js'),loadScript(base+'firebase-firestore-compat.js')]);
  firebase.initializeApp(FIREBASE_CONFIG);
  CLOUD.auth=firebase.auth();CLOUD.auth.languageCode='pt';CLOUD.db=firebase.firestore();
  try{await CLOUD.db.enablePersistence({synchronizeTabs:true})}catch(e){}
  CLOUD.auth.getRedirectResult().catch(lgErro);
  CLOUD.auth.onAuthStateChanged(onUser);
 }catch(e){console.error(e);showLogin('erro')}
}
function backupsModal(){
 openModal('Backups na nuvem','<div class="spin" style="border-color:var(--line);border-top-color:var(--brand)"></div>');
 cref().get().then(m=>{
  const b=Object.entries(m.data()?.backups||{}).sort((x,y)=>y[1].em-x[1].em);
  const dt=ms=>{const d=new Date(ms);return d.toLocaleDateString('pt-BR')+' às '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})};
  $('#mBody').innerHTML=`<p class="muted" style="margin:0 0 10px;font-size:13px">Um backup é criado a cada alteração (últimos 30) e um por dia (últimos 30 dias).</p>${b.map(([id,x])=>`<div class="row" style="padding:10px 0"><span class="grow"><b>${dt(x.em)}</b><small>${esc(x.tipo)}, ${esc(x.por||'')}, ${Math.max(1,Math.round(x.tamanho/1024))} KB</small></span><button class="btn ghost sm" data-act="bkRestore" data-arg="${id}">Restaurar</button></div>`).join('')||'<div class="empty">Nenhum backup ainda.</div>'}`;
 }).catch(()=>{$('#mBody').innerHTML='<div class="empty">Não foi possível carregar os backups. Verifique a internet.</div>'});
}

/* ---------- controle de acesso (administradores e usuários) ---------- */
const ACS={papel:null,membros:[],pedidos:[],unsubM:null,unsubP:null,unsubMe:null};
const eu=()=>(CLOUD.user?.email||'').toLowerCase();
const mref=e=>cref().collection('membros').doc(e);
const pref=e=>cref().collection('pedidos').doc(e);
const ctrlRef=()=>cref().collection('acesso').doc('controle');
const souAdmin=()=>ACS.papel==='admin';
function ouvirAprovacao(){const e=eu();ACS.unsubMe&&ACS.unsubMe();ACS.unsubMe=mref(e).onSnapshot(d=>{if(d.exists&&CLOUD.auth.currentUser){ACS.unsubMe&&ACS.unsubMe();ACS.unsubMe=null;toast('Acesso liberado');onUser(CLOUD.auth.currentUser)}},()=>{})}
/* devolve true se a pessoa já tem acesso (ou acabou de virar a primeira administradora) */
async function verificarAcesso(u){
 const e=eu(),nome=(u.displayName||'').trim()||nomeUsuario(true);
 const me=await mref(e).get();
 if(me.exists){ACS.papel=me.data().papel;return true}
 const ctrl=await ctrlRef().get();
 if(!ctrl.exists){
  const b=CLOUD.db.batch(),at=Date.now();
  b.set(ctrlRef(),{primeiroAdmin:e,criado:at});
  b.set(mref(e),{email:e,nome,papel:'admin',desde:at,por:e});
  await b.commit();ACS.papel='admin';setTimeout(()=>toast('Você é a primeira pessoa a entrar e agora é administrador(a) do sistema'),600);return true;
 }
 const p=await pref(e).get();
 if(p.exists&&p.data().status==='bloqueado'){showLogin('bloqueado');ouvirAprovacao();return false}
 if(!p.exists)await pref(e).set({email:e,nome,uid:u.uid,em:Date.now(),status:'pendente'});
 showLogin('pendente');ouvirAprovacao();return false;
}
function iniciarAcesso(){
 pararAcesso(true);
 ACS.unsubM=cref().collection('membros').onSnapshot(q=>{
  const lista=[];q.forEach(d=>lista.push(d.data()));
  const me=lista.find(m=>m.email===eu());
  if(!me){if(!q.metadata.fromCache)acessoRemovido();return}
  ACS.membros=lista.sort((a,b)=>(b.papel==='admin')-(a.papel==='admin')||String(a.nome||a.email).localeCompare(String(b.nome||b.email)));
  const antes=ACS.papel;ACS.papel=me.papel;
  if(souAdmin()&&!ACS.unsubP)ouvirPedidos();
  if(!souAdmin()&&ACS.unsubP){ACS.unsubP();ACS.unsubP=null;ACS.pedidos=[]}
  if(antes!==ACS.papel&&antes)toast(souAdmin()?'Agora você é administrador(a)':'Você deixou de ser administrador(a)');
  if(['config','inicio'].includes(S.route)&&$('#login').hidden)render();
 },()=>{});
}
function ouvirPedidos(){ACS.unsubP=cref().collection('pedidos').onSnapshot(q=>{const l=[];q.forEach(d=>l.push(d.data()));ACS.pedidos=l.sort((a,b)=>(b.em||0)-(a.em||0));if(['config','inicio'].includes(S.route)&&$('#login').hidden)render()},()=>{})}
function pararAcesso(manterPapel){['unsubM','unsubP','unsubMe'].forEach(k=>{ACS[k]&&ACS[k]();ACS[k]=null});ACS.membros=[];ACS.pedidos=[];if(!manterPapel)ACS.papel=null}
function acessoRemovido(){
 stopSync();pararAcesso();
 ['clientes','contratos','os','visitas','extras','despesas','desloc','horas','avulsos'].forEach(k=>DATA[k].length=0);
 try{localStorage.removeItem(STORE);localStorage.removeItem(META_KEY)}catch(e){}
 lastJSON=JSON.stringify({d:DATA,cfg:CFG});S.stack=[];S.route='inicio';closeIfOpen();
 showLogin('removido');
}
function usuariosView(){
 if(!FB_ON||!CLOUD.user)return `<section class="card pad"><p style="margin:0">Para controlar quem acessa o sistema, configure o Firebase e entre com uma conta. Veja o README.</p></section>`;
 const adm=souAdmin(),nAdm=ACS.membros.filter(m=>m.papel==='admin').length,e=eu();
 const pend=ACS.pedidos.filter(p=>p.status==='pendente'),bloq=ACS.pedidos.filter(p=>p.status==='bloqueado');
 const dt=ms=>ms?new Date(ms).toLocaleDateString('pt-BR'):'';
 const ini=x=>`<span class="ini" style="width:40px;height:40px;font-size:14px">${iniciais(x.nome||x.email)}</span>`;
 return `
 ${adm?`<section class="card" style="margin-bottom:16px"><h3>Pedidos de acesso ${pend.length?pill(pend.length+(pend.length>1?' pendentes':' pendente')):''}</h3>
  ${pend.map(p=>`<div class="row" style="flex-wrap:wrap">${ini(p)}<span class="grow"><b>${esc(p.nome||p.email)}</b><small>${esc(p.email)}</small><small>Pediu em ${dt(p.em)}</small></span><span class="ro"><button class="btn sm" data-act="acAceitar" data-arg="${esc(p.email)}|membro">${ic('check',16)}Aceitar</button><button class="btn ghost sm" data-act="acAceitar" data-arg="${esc(p.email)}|admin">Aceitar como administrador</button><button class="btn ghost sm danger" data-act="acRecusar" data-arg="${esc(p.email)}">Recusar</button></span></div>`).join('')||'<div class="empty">Nenhum pedido aguardando.</div>'}
 </section>`:''}
 <section class="card" style="margin-bottom:16px"><h3>Pessoas com acesso <small>${ACS.membros.length}</small></h3>
  ${ACS.membros.map(m=>{const voce=m.email===e,ultimoAdm=m.papel==='admin'&&nAdm<=1;return `<div class="row" style="flex-wrap:wrap">${ini(m)}<span class="grow"><b>${esc(m.nome||m.email)}</b><small>${esc(m.email)}</small><small>Desde ${dt(m.desde)}</small></span><span class="pills">${pill(m.papel==='admin'?'Administrador':'Usuário')}${voce?pill('Você'):''}</span>
   ${adm?`<span class="ro" style="width:100%;justify-content:flex-end">${m.papel==='admin'?`<button class="btn ghost sm" data-act="acPapel" data-arg="${esc(m.email)}|membro" ${ultimoAdm?'disabled title="É preciso ter pelo menos um administrador"':''}>Tirar de administrador</button>`:`<button class="btn ghost sm" data-act="acPapel" data-arg="${esc(m.email)}|admin">Tornar administrador</button>`}<button class="btn ghost sm danger" data-act="acRemover" data-arg="${esc(m.email)}" ${ultimoAdm?'disabled title="É preciso ter pelo menos um administrador"':''}>${voce?'Remover meu acesso':'Remover acesso'}</button></span>`:''}</div>`}).join('')||'<div class="empty">Carregando…</div>'}
  ${adm?`<div class="le-add" style="flex-wrap:wrap"><input id="acEmail" type="email" placeholder="E-mail para liberar o acesso" aria-label="E-mail para liberar o acesso" style="min-width:200px"><select id="acPapelNovo" aria-label="Tipo de acesso" style="border:1px solid var(--line);border-radius:9px;padding:8px;background:var(--surface)"><option value="membro">Usuário</option><option value="admin">Administrador</option></select><button class="btn sm" data-act="acAdd">${ic('plus',16)}Liberar</button></div>`:''}
  <p class="muted" style="margin:0;padding:12px 18px 16px;font-size:13px;border-top:1px solid var(--line)">${adm?'Administradores aceitam pedidos, liberam e removem acessos e podem tornar outras pessoas administradoras. Sempre precisa existir pelo menos um administrador.':'Somente administradores podem aceitar pedidos e alterar acessos.'}</p>
 </section>
 ${adm&&bloq.length?`<section class="card"><h3>Acesso removido ou recusado</h3>${bloq.map(p=>`<div class="row" style="flex-wrap:wrap">${ini(p)}<span class="grow"><b>${esc(p.nome||p.email)}</b><small>${esc(p.email)}</small></span><span class="ro"><button class="btn ghost sm" data-act="acAceitar" data-arg="${esc(p.email)}|membro">Liberar acesso</button><button class="btn ghost sm" data-act="acApagar" data-arg="${esc(p.email)}" title="A pessoa poderá pedir acesso de novo">Permitir novo pedido</button></span></div>`).join('')}</section>`:''}`;
}
async function acessoOp(fn,ok){try{await fn();ok&&toast(ok)}catch(e){console.error(e);toast(e.code==='permission-denied'?'Sem permissão: somente administradores podem fazer isso':'Não foi possível salvar. Verifique a internet')}}

/* ---------- gesto de voltar (Android / Chrome) ---------- */
/* Mantém entradas de histórico criadas com toque do usuário, para o gesto "voltar"
   navegar dentro do app e nunca fechar o aplicativo na tela de início. */
const HG_MAX=20;
const hgDepth=()=>(history.state&&history.state.cjI)||0;
function hgFill(){try{let d=hgDepth();while(d<HG_MAX){d++;history.pushState({cjI:d},'')}}catch(e){}}
function appBack(){
 if(!$('#login').hidden)return;
 if(!$('#modal').hidden){closeModal();return}
 if(S.leEdit){ACT.leCancel();return}
 if(S.stack.length){back();return}
 if(S.route!=='inicio'){nav('inicio');return}
 toast('Você já está na tela de início');
}
try{if(!history.state||history.state.cjI===undefined)history.replaceState({cjI:0},'')}catch(e){}
window.addEventListener('pointerdown',hgFill,true);
window.addEventListener('keydown',hgFill,true);
window.addEventListener('popstate',appBack);

$('#backBtn').innerHTML=ic('left',22);
$('#mClose').innerHTML=ic('x',20);

$('#sideBottom').innerHTML=`<button class="nv" data-nav="config">${ic('gear',19)}Configurações</button><button class="nv" data-act="sair">${ic('out',19)}Sair</button>`;
$('#bnav').innerHTML=BNAV.map(n=>`<button data-nav="${n[0]}">${ic(n[2],22)}${n[1]}</button>`).join('');
