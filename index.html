<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F3D2E">
<title>C&amp;J ELETRIC SOLUTIONS</title>
<meta name="description" content="Gestão de manutenção elétrica: clientes, contratos, agenda, ordens de serviço e financeiro.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="C&amp;J Eletric">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF3F0;--surface:#FFFFFF;--surface2:#F5F8F6;--line:#DCE5E0;--text:#15241C;--muted:#62736A;
  --brand:#1B7A4B;--brand-2:#13613E;--brand-soft:#E2F1E9;--on-brand:#FFFFFF;
  --side:#0F3D2E;--side-2:#175340;--side-text:#C9DFD3;
  --red:#D23E3E;--red-soft:#FBE8E8;--violet:#7C3AED;--violet-soft:#EFE7FD;--amber:#DC9420;--amber-soft:#FCF1DC;--blue:#2E76CF;--blue-soft:#E5EFFB;
  --shadow:0 1px 2px rgba(15,61,46,.05),0 6px 18px rgba(15,61,46,.06);
  --r:14px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1712;--surface:#13221B;--surface2:#182B22;--line:#25392F;--text:#E4EEE8;--muted:#8FA398;
    --brand:#35A46A;--brand-2:#2B8A58;--brand-soft:#16382A;--side:#08201A;--side-2:#113527;--side-text:#BCD5C8;
    --red:#E25B5B;--red-soft:#3A1D1D;--violet:#A98BF5;--violet-soft:#2A2145;--amber:#E7A93F;--amber-soft:#382C16;--blue:#5B9BE6;--blue-soft:#162B45;
    --shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1712;--surface:#13221B;--surface2:#182B22;--line:#25392F;--text:#E4EEE8;--muted:#8FA398;
  --brand:#35A46A;--brand-2:#2B8A58;--brand-soft:#16382A;--side:#08201A;--side-2:#113527;--side-text:#BCD5C8;
  --red:#E25B5B;--red-soft:#3A1D1D;--violet:#A98BF5;--violet-soft:#2A2145;--amber:#E7A93F;--amber-soft:#382C16;--blue:#5B9BE6;--blue-soft:#162B45;
  --shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 Figtree,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:left}
a{color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.i{flex:none;display:block}
h1,h2,h3{margin:0;line-height:1.2}
small{color:var(--muted);font-size:12.5px}

/* layout */
.app{display:flex;min-height:100%}
.side{width:236px;background:var(--side);color:var(--side-text);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:18px 12px;flex:none}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 20px;color:#fff}
.logo-mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(145deg,color-mix(in srgb,var(--brand) 75%,#fff),var(--brand-2));display:grid;place-items:center;color:#fff}
.logo b{font-size:19px;font-weight:800;letter-spacing:-.01em;display:block}
.logo small{color:var(--side-text);font-size:11.5px}
.side nav{display:flex;flex-direction:column;gap:2px}
.side .nv{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;font-size:14px;color:var(--side-text)}
.side .nv:hover{background:rgba(255,255,255,.06);color:#fff}
.side .nv.on{background:var(--side-2);color:#fff;font-weight:600}
.side .bottom{margin-top:auto;display:flex;flex-direction:column;gap:2px;border-top:1px solid rgba(255,255,255,.08);padding-top:10px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:14px 28px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top h1{font-size:18px;font-weight:700;flex:1}
.iconbtn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center}
.iconbtn:hover{background:var(--surface2)}
.user{display:flex;align-items:center;gap:8px;font-size:13px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700}
#view{padding:24px 28px 40px;max-width:1200px;width:100%}
.bnav{display:none}

@media (max-width:899px){
  .side{display:none}
  .top{background:var(--side);color:#fff;border:0;padding:10px 12px;top:0;padding-top:calc(10px + env(safe-area-inset-top,0px));margin-top:calc(-1 * env(safe-area-inset-top,0px))}
  .top .iconbtn:hover{background:rgba(255,255,255,.08)}
  .user .who{display:none}
  .avatar{background:rgba(255,255,255,.14);color:#fff}
  #view{padding:14px 14px calc(96px + env(safe-area-inset-bottom,0px))}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);padding:4px 0}
  .bnav button.on{color:var(--brand);font-weight:700}
  .d-only{display:none!important}
}
@media (min-width:900px){.m-only{display:none!important}}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:18px}
.card>h3,.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:15px;font-weight:700;padding:16px 18px 10px}
.sec-h a,.sec-h button.link,.link{color:var(--brand);font-size:13px;font-weight:600;text-decoration:none}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 18px;border-top:1px solid var(--line)}
.list .row:first-child{border-top:0}
button.row:hover{background:var(--surface2)}
.grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.grow b{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.g{background:var(--brand-soft);color:var(--brand)}
.pill.r{background:var(--red-soft);color:var(--red)}
.pill.a{background:var(--amber-soft);color:var(--amber)}
.pill.b{background:var(--blue-soft);color:var(--blue)}
.pill.n{background:var(--surface2);color:var(--muted)}
.tag{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--surface2);border:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--brand);color:var(--on-brand);font-weight:700;font-size:14px;padding:11px 16px;border-radius:11px;text-align:center}
.btn:hover{background:var(--brand-2)}
.btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.btn.ghost:hover{background:var(--brand-soft)}
.btn.danger{background:var(--red)}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.actions .btn{flex:1;min-width:160px}
.stack{display:flex;flex-direction:column;gap:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:899px){.grid2{grid-template-columns:1fr}}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin-bottom:14px}
.chip{padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;white-space:nowrap;color:var(--muted)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto;padding:0 8px}
.tab{padding:12px 12px 11px;font-size:13.5px;font-weight:600;color:var(--muted);border-bottom:2.5px solid transparent;white-space:nowrap}
.tab.on{color:var(--brand);border-color:var(--brand)}
.toolbar{display:flex;gap:10px;margin-bottom:14px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:0 12px;color:var(--muted)}
.search input{border:0;background:transparent;outline:0;flex:1;padding:11px 0;color:var(--text)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px;padding:4px 18px 18px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600}
.empty{padding:28px 18px;text-align:center;color:var(--muted);font-size:14px}

/* dashboard */
.hello{margin-bottom:18px}
.hello h1{font-size:26px;font-weight:800;letter-spacing:-.02em}
.hello p{margin:4px 0 0;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.kpi{display:flex;justify-content:space-between;align-items:flex-start;padding:16px 18px;width:100%}
.kpi small{font-size:13px;display:block}
.kpi strong{font-size:30px;font-weight:800;letter-spacing:-.02em;display:block;margin-top:4px}
.kpi .i{color:var(--brand)}
.kpi.r strong,.kpi.r .i{color:var(--red)}
.kpi.a strong,.kpi.a .i{color:var(--amber)}
.kpi:hover{border-color:var(--brand)}
@media (max-width:899px){.kpis{grid-template-columns:1fr 1fr;gap:10px}.kpi strong{font-size:26px}}
.dash{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.s7{grid-column:span 7}.s5{grid-column:span 5}.s4{grid-column:span 4}.s3{grid-column:span 3}
@media (max-width:1100px){.s3,.s4{grid-column:span 6}.s5,.s7{grid-column:span 12}}
@media (max-width:899px){.dash>*{grid-column:span 12!important}.o-first{order:-1}}
.shortcuts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.shortcuts button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:12px 4px}
.shortcuts .ico{width:46px;height:46px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center}
.tl{display:flex;align-items:center;gap:14px;width:100%;padding:11px 18px;border-top:1px solid var(--line)}
.tl:hover{background:var(--surface2)}
.tl-h{font-weight:700;font-size:14px;width:44px;flex:none}
.tl-bar{width:3px;align-self:stretch;border-radius:3px;background:var(--c);flex:none}
.alert{display:flex;align-items:center;gap:12px;width:100%;padding:11px 18px;border-top:1px solid var(--line)}
.alert:hover{background:var(--surface2)}
.alert .ab{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;color:#fff}
.fin3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:4px 18px 18px}
.fin3 small{display:block}
.fin3 b{font-size:17px;font-weight:800}
.legend{display:flex;flex-direction:column;gap:9px;font-size:13px;flex:1}
.legend div{display:flex;align-items:center;gap:8px}
.legend .dot{width:9px;height:9px;border-radius:50%;flex:none}
.legend span:last-child{margin-left:auto;font-weight:700}
.chartrow{display:flex;align-items:center;gap:18px;padding:6px 18px 18px}

/* client */
.thumb{width:56px;height:56px;border-radius:12px;overflow:hidden;flex:none;border:1px solid var(--line)}
.thumb svg,.cover svg{width:100%;height:100%;display:block}
.cover{height:170px;border-radius:var(--r) var(--r) 0 0;overflow:hidden}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 14px}
.contact{display:flex;flex-direction:column;gap:9px;font-size:14px}
.contact>*{display:flex;gap:10px;align-items:center;text-decoration:none}
.contact .i{color:var(--muted)}

/* form */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>span{font-size:13px;font-weight:600}
.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
.field textarea{min-height:84px;resize:vertical}
.checks{display:flex;flex-direction:column;gap:2px}
.ck{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:14px}
.ck input{width:18px;height:18px;accent-color:var(--brand)}
.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:3px}
.seg button{flex:1;text-align:center;padding:8px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--brand);box-shadow:var(--shadow)}
.steps{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:8px}
.prog{height:5px;border-radius:5px;background:var(--line);overflow:hidden;margin-bottom:18px}
.prog i{display:block;height:100%;background:var(--brand);transition:width .3s}
.photo-add{aspect-ratio:4/3;border:1.5px dashed var(--line);border-radius:12px;display:grid;place-items:center;color:var(--muted);font-size:13px;text-align:center;gap:4px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.photos .ph{aspect-ratio:4/3;border-radius:12px;overflow:hidden}
.photos .ph svg{width:100%;height:100%;display:block}
.suggest{background:var(--brand-soft);border-radius:12px;padding:16px;margin:12px 0}
.suggest b{font-size:20px;color:var(--brand)}

/* OS */
.osh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:18px}
.osh h2{font-size:22px;font-weight:800}
.chk{display:flex;align-items:center;gap:12px;width:100%;padding:11px 18px;border-top:1px solid var(--line);font-size:14px}
.chk .box{width:22px;height:22px;border-radius:6px;border:1.8px solid var(--line);display:grid;place-items:center;flex:none;color:#fff}
.chk.on .box{background:var(--brand);border-color:var(--brand)}
.chk.on span{color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 18px 16px}
.pair figure{margin:0}
.pair figcaption{font-size:12px;color:var(--muted);margin-top:4px}
.pair svg{width:100%;border-radius:10px;display:block}
.note{margin:0 18px 16px;padding:12px 14px;border-radius:10px;background:var(--red-soft);color:var(--red);font-size:13.5px;display:flex;gap:10px}
.timer{display:flex;align-items:center;gap:14px;padding:18px}
.timer strong{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* financeiro */
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th{font-size:12.5px;color:var(--muted);font-weight:600;text-align:left;padding:10px 18px;border-bottom:1px solid var(--line)}
.table td{padding:11px 18px;border-bottom:1px solid var(--line)}
.table td.n,.table th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tscroll{overflow-x:auto}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding:10px 18px 0}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;font-size:11.5px;color:var(--muted)}
.bars i{display:block;width:100%;max-width:38px;border-radius:6px 6px 2px 2px;background:var(--brand);opacity:.35}
.bars div.cur i{opacity:1}
.pos{color:var(--brand);font-weight:700}
.neg{color:var(--red);font-weight:700}

/* report doc */
.doc{max-width:760px;margin:0 auto;padding:36px 40px}
.doc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-bottom:2px solid var(--brand);padding-bottom:16px;margin-bottom:20px}
.doc h2{font-size:22px;font-weight:800}
.doc h4{font-size:14px;margin:22px 0 8px;color:var(--brand)}
.doc ul{margin:0;padding:0;list-style:none}
.doc li{display:flex;gap:8px;padding:4px 0;font-size:14px}
.doc li .i{color:var(--brand)}
.sig{display:grid;grid-template-columns:1fr 1fr;gap:32px;margin-top:40px}
.sig div{border-top:1px solid var(--text);padding-top:6px;font-size:12.5px;text-align:center}
@media (max-width:600px){.doc{padding:22px 18px}}

/* signature */
.pad-sig{border:1.5px dashed var(--line);border-radius:12px;background:var(--surface2);touch-action:none;width:100%;height:170px;display:block}
.sig-img{max-width:280px;width:100%;background:#fff;border-radius:10px;border:1px solid var(--line)}

/* modal & toast */
.modal{position:fixed;inset:0;z-index:50;background:rgba(8,20,15,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.modal[hidden]{display:none}
.sheet{background:var(--surface);border-radius:18px;width:100%;max-width:460px;max-height:88%;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.sheet header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 6px}
.sheet header h3{font-size:17px}
.sheet .body{padding:10px 18px}
.sheet footer{display:flex;gap:10px;padding:6px 18px 18px}
.sheet footer .btn{flex:1}
@media (max-width:899px){.modal{align-items:flex-end;padding:0}.sheet{border-radius:18px 18px 0 0;max-width:none;padding-bottom:env(safe-area-inset-bottom,0px)}}
.more-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 0 10px}
.more-grid button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 6px;border-radius:12px;background:var(--surface2);font-size:12.5px;font-weight:600;text-align:center}
.more-grid .i{color:var(--brand)}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (min-width:900px){#toast{bottom:28px}}
.switch{position:relative;width:44px;height:26px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:26px;transition:.2s}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked+span{background:var(--brand)}
.switch input:checked+span::after{transform:translateX(18px)}
.pill.v{background:var(--violet-soft);color:var(--violet)}
.pill .i{margin-left:-2px}
[hidden]{display:none!important}
.pills{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.pagseg button.on.g{color:var(--brand)}.pagseg button.on.a{color:var(--amber)}.pagseg button.on.r{color:var(--red)}
.inline{display:flex;gap:8px;flex-wrap:wrap}
.inline select{flex:1;min-width:190px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:9px;gap:6px}
.iconbtn.sm{width:32px;height:32px;border-radius:8px;flex:none;color:var(--muted)}
.iconbtn.sm:hover{color:var(--text)}
.iconbtn.del:hover{color:var(--red);background:var(--red-soft)}
.iconbtn[disabled]{opacity:.3;cursor:default;background:none!important}
.le{display:flex;flex-direction:column}
.le-row{display:flex;align-items:center;gap:2px;padding:5px 10px 5px 18px;border-top:1px solid var(--line)}
.le-row:first-child{border-top:0}
.le-n{width:24px;color:var(--muted);font-size:12.5px;font-weight:700;flex:none}
.le-t{flex:1;min-width:0;font-size:14px;padding-right:6px}

function migrarV1(o){
 const MAP={'Cuidado':'cuidado','Proteção':'protecao','Integral':'integral'};
 const d=o.d||{};
 (d.clientes||[]).forEach(c=>{if(MAP[c.plano])c.plano=MAP[c.plano]});
 (d.os||[]).forEach(x=>{if(!x.itens)x.itens=x.tipo==='Vistoria'?[...VIST]:[...CHK_M];if(x.chamado&&!x.motivo)x.motivo=x.chamado;if(x.tipo==='Preventiva'&&!x.ciclo)x.ciclo='Mensal';if(x.chk.length!==x.itens.length)x.chk=x.itens.map((_, i)=>x.chk[i]||0)});
 (d.visitas||[]).forEach(v=>{if(v.tipo==='Preventiva'&&!v.ciclo)v.ciclo='Mensal'});

/* reagenda as preventivas futuras conforme a periodicidade do plano */
function reagendar(id){
 const c=cli(id),p=pl(c),ct=ctBy(id);
 const fut=visitas.filter(v=>v.cli===id&&v.tipo==='Preventiva'&&v.data>HOJE&&!v.os);
 const hora=fut[0]?.hora||visitas.find(v=>v.cli===id&&v.tipo==='Preventiva')?.hora||'08:00';
 fut.forEach(v=>visitas.splice(visitas.indexOf(v),1));
 const ult=visitas.filter(v=>v.cli===id&&v.tipo==='Preventiva'&&v.data<=HOJE).map(v=>v.data).sort().pop();
 let d=ult?PER[p.per](ult):addD(HOJE,1);
 while(d<=HOJE)d=PER[p.per](d);
 const lim=[addM(HOJE,6),ct?.fim||addM(HOJE,6)].sort()[0];
 const ciclo=cicloDoPlano(p);let n=0;
 while(d<=lim&&n<24){visitas.push({id:uid('v'),data:d,hora,cli:id,tipo:'Preventiva',ciclo});n++;d=PER[p.per](d)}
 return n;
}

const tlItem=(v,del)=>{const o=v.os&&osBy(v.os);const st=visStatus(v);const h=`<button class="tl" style="--c:${TIPO[v.tipo][1]}" data-go="${o?'os:'+o.id:'visita:'+v.id}"><span class="tl-h">${v.hora}</span><span class="tl-bar"></span><span class="grow"><b>${esc(visNome(v))}</b><small>${tipoLabel(v)}${v.cli&&cli(v.cli)?.status==='Ativo'?', Plano '+esc(pl(cli(v.cli)).nome):''}</small>${v.motivo?`<small style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Motivo: ${esc(v.motivo)}</small>`:''}</span><span class="pills">${v.avulso?pill(avTag(avBy(v.avulso))):''}${st&&st!=='Agendada'||o?pill(st):''}</span></button>`;return del?`<div class="tlw">${h}<button class="iconbtn sm" data-act="cancelVisita" data-arg="${v.id}" aria-label="Excluir agendamento" title="Excluir agendamento">${ic('trash',17)}</button></div>`:h};

VIEWS.inicio=()=>{
 const hoje=visitas.filter(v=>v.data===HOJE).sort(byWhen);
 const al=alertas();
 const pend=al.reduce((s,a)=>s+a.n,0);
 const ativos=clientes.filter(c=>c.status==='Ativo').length;
 const aVencer=contratos.filter(c=>ctStatus(c)==='A vencer').length;
 const prox=visitas.filter(v=>v.data>HOJE).sort(byWhen).slice(0,5);
 const rec=soma(receitas()),gas=soma(gastos());
 const mA=mesAtual(),feita=v=>v.feito||(v.os&&osBy(v.os)?.status==='Concluída');
 const noMes=visitas.filter(v=>v.data.startsWith(mA));
 const done=noMes.filter(feita).length;
 const agend=noMes.filter(v=>v.data>=HOJE&&!feita(v)).length;
 const atrasadas=noMes.filter(v=>v.data<HOJE&&!feita(v)).length;
 const vs=[{l:'Realizadas',v:done,c:'var(--brand)'},{l:'Agendadas',v:agend,c:'var(--blue)'},{l:'Em atraso',v:atrasadas,c:'var(--red)'}];
 const kpi=(l,n,i,r,t='',arg)=>`<button class="card kpi ${t}" data-act="navto" data-arg="${r}${arg?'|'+arg:''}"><span><small>${l}</small><strong>${n}</strong></span>${ic(i,22)}</button>`;
 return {title:'Início',html:`
 <div class="hello"><div class="hello-row"><h1>Olá, ${esc(nomeUsuario())}!</h1><button class="theme-tg" id="themeBtn" data-act="toggleTheme" aria-label="${isDark()?'Modo escuro ativo. Tocar para usar o modo claro':'Modo claro ativo. Tocar para usar o modo escuro'}"><span class="${isDark()?'':'on'}">${ic('sun',15)}<em>Claro</em></span><span class="${isDark()?'on':''}">${ic('moon',15)}<em>Escuro</em></span></button></div><p>${longDate(HOJE)}. Você tem ${hoje.length} atendimentos hoje.</p></div>
 <div class="kpis">
  ${kpi('Clientes ativos',ativos,'users','clientes')}
  ${kpi('Atendimentos hoje',hoje.length,'cal','agenda')}
  ${kpi('Contratos a vencer',aVencer,'alert','contratos',aVencer?'r':'','A vencer')}
  ${kpi('Pendências',pend,'bell','alertas',pend?'a':'')}
 </div>
 <div class="shortcuts m-only">
  ${[['clientes','Clientes','users'],['agenda','Agenda','cal'],['osl','OS','tool'],['avulsos','Orçamentos','tag']].map(s=>`<button data-nav="${s[0]}"><span class="ico">${ic(s[2],22)}</span>${s[1]}</button>`).join('')}
 </div>
 <div class="dash">
  <section class="card s7"><h3>Agenda de hoje <button class="link" data-nav="agenda">Ver agenda completa</button></h3>
   ${hoje.map(tlItem).join('')||'<div class="empty">Nenhum atendimento hoje.</div>'}
  </section>
  <section class="card s5 o-first" id="alertas"><h3>Alertas <span class="pill a">${pend}</span></h3>
   ${al.map(a=>`<button class="alert" data-act="alert" data-arg="${a.go}|${a.arg??''}"><span class="ab" style="background:${a.c}">${ic(a.i,18)}</span><span class="grow"><b>${a.t}</b><small>${a.d}</small></span>${ic('right',18,'chev')}</button>`).join('')||'<div class="empty">Nenhum alerta no momento.</div>'}
  </section>
  <section class="card s5"><h3>Próximas visitas <button class="link" data-nav="agenda">Ver todas</button></h3>
   ${prox.map(v=>`<button class="row" data-go="visita:${v.id}"><b style="width:44px">${dm(v.data)}</b><span class="grow"><b>${esc(visNome(v))}</b><small>${tipoLabel(v)}</small></span>${v.avulso?pill(avTag(avBy(v.avulso))):''}</button>`).join('')}
  </section>
  <section class="card s4"><h3>Financeiro de ${mesNome(mA)} <button class="link" data-nav="financeiro">Detalhes</button></h3>
   <div class="fin3"><div><small>Receita</small><b class="pos">${brl(rec)}</b></div><div><small>Despesas</small><b class="neg">${brl(gas)}</b></div><div><small>Lucro</small><b>${brl(rec-gas)}</b></div></div>
  </section>
  <section class="card s3"><h3>Visitas em ${mesNome(mA)}</h3>
   <div class="chartrow">${donut(vs,104,14,vs.reduce((s,p)=>s+p.v,0))}${legend(vs)}</div>
  </section>
 </div>`};
};

/* clientes */
function cliRows(){
 const q=S.q.trim().toLowerCase();
 const l=clientes.filter(c=>(S.segF==='Todos'||c.seg===S.segF)&&(!q||c.nome.toLowerCase().includes(q)||c.seg.toLowerCase().includes(q)||pl(c).nome.toLowerCase().includes(q)));
 return l.map(c=>{const ct=ctBy(c.id);return `<button class="row" data-go="cliente:${c.id}"><span class="thumb">${pic(c)}</span><span class="grow"><b>${esc(c.nome)}</b><small>Plano ${esc(pl(c).nome)}, ${esc(c.seg)}</small><small>Próxima visita: ${proxVisita(c.id)}</small></span><span class="pills">${pill(c.status)}${ct?.assinado?pill(ct.pag):''}</span>${ic('right',18,'chev')}</button>`}).join('')||`<div class="empty">Nenhum cliente encontrado${S.q?` para “${esc(S.q)}”`:''}${S.segF!=='Todos'?` na categoria ${esc(S.segF)}`:''}.</div>`;
}
VIEWS.clientes=()=>{
 const segs=['Todos',...SEGMENTOS.filter(s=>s==='Residência'||clientes.some(c=>c.seg===s))];
 return {title:'Clientes',html:`
 <div class="toolbar"><label class="search">${ic('search',18)}<input id="q" type="search" placeholder="Buscar por nome, categoria ou plano" value="${esc(S.q)}" aria-label="Buscar cliente"></label><button class="btn" data-act="novoCliente" aria-label="Novo cliente">${ic('plus',18)}<span class="d-only">Novo cliente</span></button></div>
 <div class="chips">${segs.map(s=>`<button class="chip ${S.segF===s?'on':''}" data-act="setF" data-arg="segF|${s}">${s}${s!=='Todos'?` (${clientes.filter(c=>c.seg===s).length})`:''}</button>`).join('')}</div>
 <div class="card list" id="cliList">${cliRows()}</div>`};
};

VIEWS.cliente=id=>{
 const c=cli(id),ct=ctBy(id),p=pl(c),hist=os.filter(o=>o.cli===id).sort(byWhen).reverse();
 return {title:'Ficha do cliente',html:`
 <div class="grid2">
  <div class="card"><div class="cover">${pic(c)}</div><div class="pad">
   <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><h2>${esc(c.nome)}</h2><button class="btn ghost sm" data-act="editCli" data-arg="${id}">${ic('pen',16)}Editar</button></div>
   <div class="tags"><span class="tag">${esc(c.seg)}</span><span class="tag">Plano ${esc(p.nome)}</span>${pill(c.status)}${ct?.assinado?pill(ct.pag):''}</div>
   <div class="contact"><a href="tel:${c.tel.replace(/\D/g,'')}">${ic('phone',18)}${esc(c.tel)}</a><a href="mailto:${esc(c.email)}">${ic('mail',18)}${esc(c.email)}</a><span>${ic('pin',18)}${esc(c.end)}</span></div>
  </div></div>
  <div class="stack">
   <section class="card"><h3>Contrato <button class="link" data-go="contrato:${id}">Ver contrato</button></h3>
    <dl class="kv"><dt>Plano</dt><dd>${esc(p.nome)}, ${brl(p.v)}/mês</dd><dt>Visitas</dt><dd>${p.per} (${PER_TXT[p.per]})</dd><dt>Situação</dt><dd>${pill(ctStatus(ct))}</dd><dt>Vigência</dt><dd>${dmy(ct.ini)} a ${dmy(ct.fim)}</dd>
    <dt>Pagamento</dt><dd>${ct.assinado?`${pill(ct.pag)} <button class="link" data-act="pagar" data-arg="${id}">Alterar</button>`:'Aguardando assinatura'}</dd><dt>Próxima visita</dt><dd>${proxVisita(id)}</dd><dt>Local</dt><dd>${c.area} m², ${c.quadros} ${c.quadros>1?'quadros':'quadro'}</dd></dl>
    <div class="pad" style="padding-top:0"><button class="btn ghost block" data-act="trocarPlano" data-arg="${id}">${ic('swap',18)}Trocar plano</button></div>
   </section>
   <section class="card"><h3>Histórico de atendimentos</h3>
    ${hist.map(o=>`<button class="row" data-go="os:${o.id}"><b style="width:82px;font-size:13.5px">${dmy(o.data)}</b><span class="grow"><b>${tipoLabel(o)}</b><small>OS ${osNum(o.id)}${o.motivo?', '+esc(o.motivo):''}</small></span>${pill(o.status)}</button>`).join('')||'<div class="empty">Nenhum atendimento registrado ainda.</div>'}
   </section>
  </div>
 </div>
 <section class="card" style="margin-top:16px"><h3>Orçamentos de serviço <button class="link" data-act="novoOrcCli" data-arg="${id}">+ Novo orçamento</button></h3>
  ${avulsos.filter(a=>a.cli===id).sort((a,b)=>b.num-a.num).map(a=>`<button class="row" data-go="avulso:${a.id}"><b style="width:82px;font-size:13.5px">${dmy(a.criado)}</b><span class="grow"><b style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(a.desc)}</b><small>Nº ${avNum(a)}, ${brl(avTotal(a))}</small></span>${pill(a.status)}</button>`).join('')||'<div class="empty">Nenhum orçamento para este cliente.</div>'}
 </section>
 <div class="actions"><button class="btn ghost" data-go="avaliacao:${id}">${ic('clip',18)}Nova avaliação</button><button class="btn" data-act="agendar" data-arg="${id}">${ic('cal',18)}Agendar visita</button></div>
 <div class="actions"><button class="btn ghost danger" data-act="delCli" data-arg="${id}">${ic('trash',18)}Excluir cliente</button></div>`};
};

/* avaliação técnica */
const STEPS=['Dados do local','Instalação elétrica','Fotos','Resumo e proposta'];
function newAval(id){const c=id&&id!=='new'?cli(id):null;return {step:1,cliId:c?.id||null,nome:c?.nome||'',seg:c?.seg||'Comércio',area:c?String(c.area):'',quadros:c?String(Math.min(c.quadros,4)):'1',equip:CFG.equip[0]||'',pontos:[],obs:'',fornec:'Trifásico',aterr:'Sim',idade:'5 a 15 anos',dr:'Não',fotos:0}}
function planoSugerido(a){
 let s=a.pontos.length;const q=+a.quadros,ar=+a.area||0;
 s+=q>=3?2:q===2?1:0;s+=ar>250?2:ar>100?1:0;s+=a.idade==='Mais de 15 anos'?2:0;s+=a.aterr==='Não'?1:0;s+=a.dr==='Não'?1:0;
 const at=planosAtivos();if(!at.length)return planos[0].id;
 const idx=s>=7?at.length-1:s>=3?Math.floor((at.length-1)/2)+(at.length>2?0:0):0;
 return at[Math.min(idx,at.length-1)].id;
}
const opt=(arr,v)=>arr.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');
const segBtns=(key,arr)=>`<div class="seg">${arr.map(x=>`<button type="button" class="${S.aval[key]===x?'on':''}" data-act="segSet" data-arg="${key}|${x}">${x}</button>`).join('')}</div>`;
VIEWS.avaliacao=id=>{
 if(!S.aval||(id&&S.aval.cliId!==(id==='new'?null:id)&&S.aval._for!==id)){S.aval=newAval(id);S.aval._for=id}
 const a=S.aval,st=a.step;
 if(a.equip&&!CFG.equip.includes(a.equip))a.equip=CFG.equip[0]||'';
 let body='';
 if(st===1)body=`
  <label class="field"><span>Nome do local ou do cliente</span><input data-bind="nome" value="${esc(a.nome)}" placeholder="Ex.: Mercado Boa Compra ou Residência Silva"></label>
  <label class="field"><span>Categoria</span><select data-bind="seg">${opt(SEGMENTOS,a.seg)}</select></label>
  <label class="field"><span>Área aproximada (m²)</span><input data-bind="area" inputmode="numeric" value="${esc(a.area)}" placeholder="120"></label>
  <label class="field"><span>Quantidade de quadros elétricos</span><select data-bind="quadros">${[1,2,3,4].map(n=>`<option value="${n}" ${String(n)===a.quadros?'selected':''}>${n===4?'4 ou mais':n} ${n>1?'quadros':'quadro'}</option>`).join('')}</select></label>
  <div class="field"><span>Equipamento de maior consumo</span>
   ${CFG.equip.length?`<select data-bind="equip" aria-label="Equipamento de maior consumo">${opt(CFG.equip,a.equip)}</select>`:'<p class="muted" style="margin:0;font-size:14px">Nenhum equipamento cadastrado.</p>'}
   <div class="inline-btns"><button type="button" class="btn ghost sm" data-act="equipAdd">${ic('plus',16)}Adicionar equipamento</button><button type="button" class="btn ghost sm" data-act="equipEdit">${ic('pen',16)}Editar lista</button></div>
  </div>
  <div class="field"><span>Itens da vistoria (pontos de atenção)</span><div class="checks">${CFG.vistoria.map(p=>`<label class="ck"><input type="checkbox" data-bindarr="pontos" value="${esc(p)}" ${a.pontos.includes(p)?'checked':''}>${esc(p)}</label>`).join('')||'<small>Cadastre os itens em Configurações.</small>'}</div></div>
  <label class="field"><span>Observações</span><textarea data-bind="obs" placeholder="Ex.: quadro sem identificação, tomadas soltas no estoque">${esc(a.obs)}</textarea></label>`;
 if(st===2)body=`
  <div class="field"><span>Tipo de fornecimento</span>${segBtns('fornec',['Monofásico','Bifásico','Trifásico'])}</div>
  <div class="field"><span>Possui aterramento?</span>${segBtns('aterr',['Sim','Não','Não sei'])}</div>
  <div class="field"><span>Idade aproximada da fiação</span>${segBtns('idade',['Até 5 anos','5 a 15 anos','Mais de 15 anos'])}</div>
  <div class="field"><span>Possui dispositivo DR?</span>${segBtns('dr',['Sim','Não'])}</div>`;
 if(st===3)body=`
  <p class="muted" style="margin:0 0 12px">Fotografe os quadros e os pontos de atenção. Elas vão para o histórico do cliente e para o relatório.</p>
  <div class="photos">${Array.from({length:a.fotos},()=>`<div class="ph">${panel(false)}</div>`).join('')}<button class="photo-add" data-act="addFoto">${ic('cam',24)}<span>Adicionar foto</span></button></div>`;
 if(st===4){const sid=planoSugerido(a),esc_=a.planoEsc&&planos.some(p=>p.id===a.planoEsc&&p.ativo)?a.planoEsc:sid;a.planoEsc=esc_;const p=planById(sid);body=`
  <dl class="kv" style="padding:0 0 8px"><dt>Local</dt><dd>${esc(a.nome||'Sem nome')}</dd><dt>Categoria</dt><dd>${esc(a.seg)}</dd><dt>Área</dt><dd>${esc(a.area||'—')} m²</dd><dt>Quadros</dt><dd>${a.quadros}</dd><dt>Maior consumo</dt><dd>${esc(a.equip||'—')}</dd><dt>Fornecimento</dt><dd>${a.fornec}</dd><dt>Aterramento</dt><dd>${a.aterr}</dd><dt>Fiação</dt><dd>${a.idade}</dd><dt>DR</dt><dd>${a.dr}</dd><dt>Pontos de atenção</dt><dd>${esc(a.pontos.join(', ')||'Nenhum')}</dd><dt>Fotos</dt><dd>${a.fotos}</dd></dl>
  <div class="suggest"><small>Plano sugerido pela avaliação</small><br><b>Plano ${esc(p.nome)}</b> <span class="muted">${brl(p.v)}/mês, ${PER_TXT[p.per]}</span><ul style="margin:10px 0 0;padding-left:18px;font-size:13.5px">${p.serv.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div>
  <div class="field"><span>Plano da proposta</span><select data-bind="planoEsc">${planosAtivos().map(x=>`<option value="${x.id}" ${x.id===esc_?'selected':''}>${esc(x.nome)}, ${brl(x.v)}/mês</option>`).join('')}</select></div>`}
 return {title:'Avaliação técnica',html:`
 <div class="card pad" style="max-width:640px">
  <div class="steps"><span>Etapa ${st} de 4</span><span>${STEPS[st-1]}</span></div>
  <div class="prog"><i style="width:${st*25}%"></i></div>
  <h2 style="font-size:19px;margin-bottom:16px">${STEPS[st-1]}</h2>
  ${body}
  <div class="actions">${st>1?`<button class="btn ghost" data-act="avalStep" data-arg="-1">Voltar</button>`:''}${st<4?`<button class="btn" data-act="avalStep" data-arg="1">Próximo</button>`:`<button class="btn" data-act="gerarProposta">${ic('send',18)}Gerar proposta</button>`}</div>
 </div>`};
};

/* contratos */
VIEWS.contratos=()=>{
 const F=['Todos','Ativos','A vencer','Propostas'];
 const l=contratos.filter(c=>{const s=ctStatus(c);return S.ctF==='Todos'||(S.ctF==='Ativos'&&s==='Ativo')||(S.ctF==='A vencer'&&s==='A vencer')||(S.ctF==='Propostas'&&s==='Proposta')});
 const mrr=contratos.filter(c=>c.assinado).reduce((s,c)=>s+pl(cli(c.cli)).v,0);
 return {title:'Contratos',html:`
 <div class="chips">${F.map(f=>`<button class="chip ${S.ctF===f?'on':''}" data-act="setF" data-arg="ctF|${f}">${f}</button>`).join('')}</div>
 <div class="card list">${l.map(ct=>{const c=cli(ct.cli),s=ctStatus(ct),p=pl(c);return `<button class="row" data-go="contrato:${c.id}"><span class="thumb">${pic(c)}</span><span class="grow"><b>${esc(c.nome)}</b><small>Plano ${esc(p.nome)}, ${brl(p.v)}/mês</small><small>${s==='Proposta'?'Proposta enviada em '+dmy(ct.proposta):'Vigente até '+dmy(ct.fim)}</small></span><span class="pills">${pill(s)}${ct.assinado?pill(ct.pag):''}</span></button>`}).join('')||'<div class="empty">Nenhum contrato neste filtro.</div>'}</div>
 <p class="muted" style="font-size:13px;margin-top:12px">Receita recorrente dos contratos assinados: <b>${brl(mrr)}/mês</b></p>`};
};
VIEWS.contrato=id=>{
 const c=cli(id),ct=ctBy(id),p=pl(c),s=ctStatus(ct);
 const tabs=[['det','Detalhes'],['serv','Serviços'],['ass','Assinatura']];
 let body='';
 if(S.ctTab==='det')body=`<dl class="kv" style="padding-top:16px"><dt>Plano</dt><dd>${esc(p.nome)}${p.ativo?'':' '+pill('Desativado')}</dd><dt>Visitas</dt><dd>${p.per}, ${PER_TXT[p.per]}</dd><dt>Vigência</dt><dd>${dmy(ct.ini)} a ${dmy(ct.fim)}</dd><dt>Mensalidade</dt><dd>${brl(p.v)}</dd><dt>Vencimento</dt><dd>Todo dia ${ct.venc}</dd><dt>Próximo vencimento</dt><dd>${dmy(proxVenc(ct))}</dd><dt>Forma de pagamento</dt><dd>PIX ou boleto</dd><dt>Pagamento</dt><dd>${ct.assinado?`${pill(ct.pag)} <button class="link" data-act="pagar" data-arg="${id}">Alterar</button>`:'Após assinatura'}</dd>${s==='A vencer'?`<dt>Renovação</dt><dd class="neg">Vence em ${diff(HOJE,ct.fim)} dias</dd>`:''}${(ct.hist||[]).map(h=>`<dt>Troca de plano</dt><dd>${dmy(h.data)}: ${esc(h.de)} para ${esc(h.para)}</dd>`).join('')}</dl>`;
 if(S.ctTab==='serv')body=`<ul style="list-style:none;margin:0;padding:8px 0">${p.serv.map(x=>`<li class="chk on" style="border:0;padding:8px 18px"><span class="box">${ic('check',14)}</span><span style="color:var(--text)">${esc(x)}</span></li>`).join('')}</ul>`;
 if(S.ctTab==='ass')body=ct.sig||ct.assinado?`<div class="pad"><p style="margin:0 0 10px">${pill('Assinado')} ${ct.sigName?`por <b>${esc(ct.sigName)}</b> em ${dmy(ct.sigData||HOJE)}`:`em ${dmy(ct.ini)}`}</p>${ct.sig?`<img class="sig-img" src="${ct.sig}" alt="Assinatura do cliente">`:'<p class="muted" style="margin:0">Assinatura registrada digitalmente no início da vigência.</p>'}</div>`
  :`<div class="pad"><p class="muted" style="margin:0 0 12px">Peça ao responsável pelo local para assinar com o dedo na área abaixo.</p><label class="field"><span>Nome do responsável</span><input id="sigName" placeholder="Nome completo"></label><canvas class="pad-sig" id="sigPad" aria-label="Área de assinatura"></canvas><div class="actions"><button class="btn ghost" data-act="sigClear">Limpar</button><button class="btn" data-act="sigSave" data-arg="${id}">${ic('pen',18)}Assinar contrato</button></div></div>`;
 return {title:'Contrato',html:`
 <div class="card" style="max-width:720px">
  <div class="row" style="border:0;padding:18px"><span class="thumb">${pic(c)}</span><span class="grow"><b style="font-size:17px">${esc(c.nome)}</b><small>Plano ${esc(p.nome)}</small></span>${pill(s)}</div>
  <div class="tabs">${tabs.map(t=>`<button class="tab ${S.ctTab===t[0]?'on':''}" data-act="setF" data-arg="ctTab|${t[0]}">${t[1]}</button>`).join('')}</div>
  ${body}
 </div>
 <div class="actions" style="max-width:720px">
  <button class="btn ghost" data-go="cliente:${id}">${ic('users',18)}Ver cliente</button>
  <button class="btn ghost" data-act="trocarPlano" data-arg="${id}">${ic('swap',18)}Trocar plano</button>
  ${s==='A vencer'?`<button class="btn" data-act="renovar" data-arg="${id}">Renovar por 12 meses</button>`:''}
  ${s==='Proposta'&&S.ctTab!=='ass'?`<button class="btn" data-act="setF" data-arg="ctTab|ass">${ic('pen',18)}Coletar assinatura</button>`:''}
 </div>`,after:S.ctTab==='ass'&&!ct.assinado?initSig:null};
};

/* agenda */
VIEWS.agenda=()=>{
 const days=Array.from({length:7},(_,i)=>addD(HOJE,i));
 const dia=visitas.filter(v=>v.data===S.agDay).sort(byWhen);
 const depois=visitas.filter(v=>v.data>days[6]).sort(byWhen);
 return {title:'Agenda',html:`
 <div class="card pad" style="padding:12px;margin-bottom:16px"><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">
  ${days.map(d=>{const n=visitas.filter(v=>v.data===d).length;const on=d===S.agDay;return `<button data-act="agDay" data-arg="${d}" style="text-align:center;padding:8px 0;border-radius:12px;${on?'background:var(--brand);color:#fff':''}"><small style="${on?'color:#fff':''}">${WD[D(d).getDay()]}</small><div style="font-weight:800;font-size:17px">${d.slice(8)}</div><div style="height:6px;display:flex;justify-content:center;gap:2px">${Array.from({length:Math.min(n,3)},()=>`<i style="width:5px;height:5px;border-radius:50%;background:${on?'#fff':'var(--brand)'}"></i>`).join('')}</div></button>`}).join('')}
 </div></div>
 <div class="grid2">
  <section class="card"><h3>${S.agDay===HOJE?'Hoje':longDate(S.agDay).split(',')[0]}, ${dm(S.agDay)} <button class="link" data-act="agendar">+ Agendar</button></h3>${dia.length?'<p class="muted" style="margin:-6px 18px 8px;font-size:12.5px">Toque na lixeira para excluir um agendamento.</p>':''}
   ${dia.map(v=>tlItem(v,true)).join('')||'<div class="empty">Dia livre. Toque em “Agendar” para marcar uma visita.</div>'}
  </section>
  <section class="card"><h3>Mais adiante</h3>
   ${depois.map(v=>`<button class="row" data-go="visita:${v.id}"><b style="width:44px">${dm(v.data)}</b><span class="grow"><b>${esc(visNome(v))}</b><small>${v.hora}, ${tipoLabel(v).toLowerCase()}</small></span>${v.avulso?pill(avTag(avBy(v.avulso))):''}</button>`).join('')||'<div class="empty">Nada agendado depois desta semana.</div>'}
  </section>
 </div>
 <p class="muted" style="font-size:13px;margin-top:12px">${pill('Avulso')} e ${pill('Serviço extra')} indicam serviços fora do plano, agendados a partir de um orçamento aprovado.</p>`};
};
VIEWS.visita=id=>{
 const v=visBy(id);
 if(!v)return {title:'Visita',html:'<div class="card empty">Esta visita não existe mais.</div>'};
 const av=v.avulso&&avBy(v.avulso),c=v.cli&&cli(v.cli),o=v.os&&osBy(v.os);
 const itens=itensPara(v);
 return {title:'Visita',html:`
 <div class="card" style="max-width:720px">
  <div class="row" style="border:0;padding:18px">${c?`<span class="thumb">${pic(c)}</span>`:`<span class="ini">${iniciais(av?.nome)}</span>`}<span class="grow"><b style="font-size:17px">${esc(visNome(v))}</b><small>${tipoLabel(v)}</small></span><span class="pills">${av?pill(avTag(av)):''}${pill(visStatus(v))}</span></div>
  ${v.motivo?`<div class="note ${v.tipo==='Corretiva'?'a':''}">${ic('alert',18)}<span><b>Motivo da solicitação</b>${esc(v.motivo)}</span></div>`:precisaMotivo(v.tipo)?`<div class="note a">${ic('alert',18)}<span>Nenhum motivo informado. <button class="link" data-act="editVisita" data-arg="${id}">Informar agora</button></span></div>`:''}
  <dl class="kv"><dt>Data</dt><dd>${longDate(v.data)}</dd><dt>Horário</dt><dd>${v.hora}</dd>${c?`<dt>Plano</dt><dd>${esc(pl(c).nome)}</dd>`:''}<dt>Endereço</dt><dd>${esc((av||c).end)}</dd><dt>Telefone</dt><dd><a href="tel:${(av||c).tel.replace(/\D/g,'')}">${esc((av||c).tel)}</a></dd>${av?`<dt>Serviço</dt><dd>${esc(av.desc)}</dd><dt>Valor</dt><dd>${brl(avTotal(av))}</dd>`:''}</dl>
  ${!av&&!o?`<h3 class="sec-h" style="padding-top:4px">${nomeChk(v)} <small>${itens.length} itens</small></h3><ul class="chk-prev">${itens.map(t=>`<li>${ic('check',14)}${esc(t)}</li>`).join('')}</ul>`:''}
 </div>
 <div class="actions" style="max-width:720px">
  ${av?`<button class="btn ghost" data-go="avulso:${av.id}">${ic('tag',18)}Ver orçamento</button>${v.feito?'':`<button class="btn" data-act="avConcluir" data-arg="${av.id}">${ic('check',18)}Concluir serviço</button>`}`
     :o?`<button class="btn" data-go="os:${o.id}">${ic('tool',18)}Ver OS ${osNum(o.id)}</button>`:`<button class="btn" data-act="abrirOS" data-arg="${id}">${ic('tool',18)}Abrir OS com ${nomeChk(v).toLowerCase()}</button>`}
  <button class="btn ghost" data-act="editVisita" data-arg="${id}">${ic('pen',18)}Editar visita</button>
  ${!o||o.status==='Agendada'?`<button class="btn ghost danger" data-act="cancelVisita" data-arg="${id}">${ic('trash',18)}Excluir agendamento</button>`:''}
 </div>`};
};

/* ordens de serviço */
VIEWS.osl=()=>{
 const F=['Todas','Abertas','Em andamento','Agendadas','Concluídas'];
 const map={Abertas:'Aberta','Em andamento':'Em andamento',Agendadas:'Agendada',Concluídas:'Concluída'};
 const l=os.filter(o=>S.osF==='Todas'||o.status===map[S.osF]).sort(byWhen).reverse();
 return {title:'Ordens de serviço',html:`
 <div class="chips">${F.map(f=>`<button class="chip ${S.osF===f?'on':''}" data-act="setF" data-arg="osF|${f}">${f}</button>`).join('')}</div>
 <div class="card list">${l.map(o=>{const c=cli(o.cli);const pr=o.chk.filter(Boolean).length;return `<button class="row" data-go="os:${o.id}"><span class="ab" style="width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,${TIPO[o.tipo][1]} 16%,transparent);color:${TIPO[o.tipo][1]}">${ic('tool',19)}</span><span class="grow"><b>OS ${osNum(o.id)}, ${esc(c.nome)}</b><small>${tipoLabel(o)}, ${dmy(o.data)} às ${o.hora}</small>${o.status==='Em andamento'?`<div class="bar" style="margin-top:6px;max-width:180px"><i style="width:${pr/(o.itens.length||1)*100}%"></i></div>`:''}</span>${pill(o.status)}</button>`}).join('')||'<div class="empty">Nenhuma OS neste filtro.</div>'}</div>`};
};
VIEWS.os=id=>{
 const o=osBy(id),c=cli(o.cli);
 const tabs=[['servicos',o.tipo==='Vistoria'?'Vistoria':'Check-list'],['materiais','Materiais'],['fotos','Fotos'],['tempo','Tempo e km'],['relatorio','Relatório']];
 const tot=o.itens.length,pr=o.chk.filter(Boolean).length,locked=o.status==='Concluída';
 const matTot=o.mats.reduce((s,m)=>s+m[1]*m[2],0);
 let body='';
 if(S.osTab==='servicos')body=`
  <div style="padding:14px 18px 4px"><small>${nomeChk(o)}</small></div>
  <div style="padding:4px 18px 10px;display:flex;align-items:center;gap:12px"><div class="bar" style="flex:1"><i style="width:${tot?pr/tot*100:0}%"></i></div><small><b>${pr}</b> de ${tot}</small></div>
  ${o.itens.map((t,i)=>`<button class="chk ${o.chk[i]?'on':''}" data-act="chk" data-arg="${id}|${i}" ${locked?'disabled':''} aria-pressed="${!!o.chk[i]}"><span class="box">${o.chk[i]?ic('check',14):''}</span><span>${esc(t)}</span></button>`).join('')||'<div class="empty">Check-list vazio.</div>'}
  <div class="pad" style="border-top:1px solid var(--line)"><label class="field" style="margin:0"><span>Observações</span><textarea data-obs="${id}" ${locked?'readonly':''} placeholder="O que foi encontrado e o que recomenda ao cliente">${esc(o.obs)}</textarea></label></div>`;
 if(S.osTab==='materiais')body=`
  ${o.mats.map(m=>`<div class="row"><span class="grow"><b>${esc(m[0])}</b><small>${m[1]} × ${brl(m[2])}</small></span><b>${brl(m[1]*m[2])}</b></div>`).join('')||'<div class="empty">Nenhum material usado nesta OS.</div>'}
  <div class="row" style="background:var(--surface2)"><span class="grow"><b>Total de materiais</b><small>Lançado automaticamente nas despesas</small></span><b>${brl(matTot)}</b></div>
  ${locked?'':`<div class="pad"><button class="btn ghost block" data-act="addMat" data-arg="${id}">${ic('plus',18)}Adicionar material</button></div>`}`;
 if(S.osTab==='fotos')body=o.fotos?`
  <h3 class="sec-h">Quadro principal</h3><div class="pair"><figure>${panel(false)}<figcaption>Antes do serviço</figcaption></figure><figure>${panel(o.status==='Concluída')}<figcaption>${o.status==='Concluída'?'Depois do serviço':'Depois: adicione ao concluir'}</figcaption></figure></div>
  ${locked?'':`<div class="pad" style="padding-top:0"><button class="btn ghost block" data-act="addFotoOS">${ic('cam',18)}Adicionar foto</button></div>`}`
  :`<div class="empty">Nenhuma foto ainda.<br><br><button class="btn ghost" data-act="addFotoOS">${ic('cam',18)}Tirar foto de antes</button></div>`;
 if(S.osTab==='tempo'){const run=S.timer&&S.timer.os===id;body=`
  <div class="timer"><span class="grow"><small>Tempo nesta OS</small><strong id="timerTxt">${fh(o.horas+(run?(Date.now()-S.timer.t0)/3.6e6:0))}</strong></span>${locked?'':`<button class="btn ${run?'danger':''}" data-act="timer" data-arg="${id}">${ic(run?'stop':'play',18)}${run?'Parar':'Iniciar'}</button>`}</div>
  <dl class="kv"><dt>Deslocamento</dt><dd>${o.km} km (${brl(o.km*CFG.km)})</dd><dt>Endereço</dt><dd>${esc(c.end)}</dd></dl>
  ${locked?'':`<div class="pad" style="padding-top:0"><button class="btn ghost block" data-act="kmOS" data-arg="${id}">${ic('car',18)}Registrar quilometragem</button></div>`}`}
 if(S.osTab==='relatorio')body=locked?`<div class="pad"><p style="margin:0 0 14px">O relatório reúne o check-list, materiais, fotos, tempo e observações desta OS.</p><button class="btn block" data-go="relatorio:${id}">${ic('doc',18)}Gerar relatório</button></div>`:`<div class="empty">O relatório fica disponível quando a OS é concluída.</div>`;
 const main=o.status==='Agendada'||o.status==='Aberta'?`<button class="btn block" data-act="osStatus" data-arg="${id}|Em andamento">${ic('play',18)}Iniciar atendimento</button>`:o.status==='Em andamento'?`<button class="btn block" data-act="concluir" data-arg="${id}">${ic('check',18)}Concluir OS</button>`:'';
 return {title:'OS '+osNum(id),html:`
 <div class="card" style="max-width:760px">
  <div class="osh"><div><h2>OS ${osNum(id)}</h2><small>${dmy(o.data)} às ${o.hora}</small><div style="margin-top:6px"><button class="link" data-go="cliente:${c.id}">${esc(c.nome)}</button> <small>, ${tipoLabel(o)}</small></div></div>${pill(o.status)}</div>
  ${o.motivo?`<div class="note ${o.tipo==='Corretiva'?'a':''}">${ic('alert',18)}<span><b>Motivo da solicitação</b>${esc(o.motivo)}</span></div>`:''}
  <div class="tabs">${tabs.map(t=>`<button class="tab ${S.osTab===t[0]?'on':''}" data-act="setF" data-arg="osTab|${t[0]}">${t[1]}</button>`).join('')}</div>
  ${body}
 </div>
 <div class="actions" style="max-width:760px">${main}<button class="btn ghost danger" data-act="delOS" data-arg="${id}">${ic('trash',18)}Excluir OS</button></div>`};
};

/* orçamentos de serviço (pessoas sem plano e clientes cadastrados) */
const avTag=a=>a?.cli?'Serviço extra':'Avulso';
const matsCli=a=>(a.matCli||[]).filter(m=>String(m[0]).trim());
const boxChk='<span style="display:inline-block;width:16px;height:16px;border:1.5px solid currentColor;border-radius:4px;vertical-align:-3px"></span>';
VIEWS.avulsos=()=>{
 const F=['Todos','Em aberto','Aprovado','Recusado','Concluído'];
 const l=avulsos.filter(a=>S.avF==='Todos'||a.status===S.avF).sort((a,b)=>b.num-a.num);
 const ab=avulsos.filter(a=>a.status==='Em aberto'),ap=avulsos.filter(a=>a.status==='Aprovado');
 return {title:'Orçamentos',html:`
 <div class="kpis k3">
  <div class="card kpi"><span><small>Em aberto</small><strong>${ab.length}</strong></span>${ic('doc',22)}</div>
  <div class="card kpi"><span><small>Aprovados</small><strong>${ap.length}</strong></span>${ic('check',22)}</div>
  <div class="card kpi"><span><small>Valor aprovado</small><strong style="font-size:22px">${brl(ap.reduce((s,a)=>s+avTotal(a),0))}</strong></span></div>
 </div>
 <div class="toolbar"><div class="chips" style="margin:0;flex:1">${F.map(f=>`<button class="chip ${S.avF===f?'on':''}" data-act="setF" data-arg="avF|${f}">${f}</button>`).join('')}</div></div>
 <div class="card list">${l.map(a=>{const v=a.visita&&visBy(a.visita),c=a.cli&&cli(a.cli);return `<button class="row" data-go="avulso:${a.id}">${c?`<span class="thumb" style="width:44px;height:44px;border-radius:50%">${pic(c)}</span>`:`<span class="ini">${iniciais(a.nome)}</span>`}<span class="grow"><b>${esc(a.nome)}</b><small style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(a.desc)}</small><small>Nº ${avNum(a)}, ${brl(avTotal(a))}${matsCli(a).length?`, ${matsCli(a).length} ${matsCli(a).length>1?'materiais':'material'} por conta do cliente`:''}${v?`, agendado para ${dm(v.data)} às ${v.hora}`:''}</small></span><span class="pills">${pill(a.status)}${pill(avTag(a))}</span>${ic('right',18,'chev')}</button>`}).join('')||'<div class="empty">Nenhum orçamento neste filtro.</div>'}</div>
 <div class="actions"><button class="btn" data-act="novoAvulso">${ic('plus',18)}Novo orçamento</button></div>`};
};
function preencherDoCliente(f,id){const c=cli(id);if(!c)return;f.cli=c.id;f.nome=c.nome;f.tel=c.tel==='—'?'':c.tel;f.email=c.email==='—'?'':c.email;f.end=c.end==='Endereço a cadastrar'?'':c.end;f.cat=c.seg}
function blankAv(cid){const f={id:null,cli:null,nome:'',tel:'',email:'',end:'',cat:'Residência',desc:'',itens:[['',1,'']],matCli:[],mao:'',descto:'',prazo:addD(HOJE,7),validade:15,obs:'',status:'Em aberto'};if(cid)preencherDoCliente(f,cid);return f}
function avTotHtml(f){
 const it=f.itens.reduce((s,i)=>s+num(i[1])*num(i[2]),0),nc=matsCli(f).length;
 return `<div><span>Materiais por nossa conta</span><span>${brl(it)}</span></div><div><span>Mão de obra</span><span>${brl(num(f.mao))}</span></div>${num(f.descto)?`<div><span>Desconto</span><span class="neg">– ${brl(num(f.descto))}</span></div>`:''}<div class="t"><span>Total</span><span>${brl(it+num(f.mao)-num(f.descto))}</span></div>${nc?`<div class="muted" style="font-size:12.5px;padding-top:8px"><span>Materiais por conta do cliente</span><span>${nc} ${nc>1?'itens':'item'}, fora do total</span></div>`:''}`;
}
VIEWS.avulsoForm=id=>{
 if(!S.avf||S.avf._for!==id){const src=id&&id!=='new'?avBy(id):null;S.avf=src?JSON.parse(JSON.stringify(src)):blankAv();S.avf._for=id}
 const f=S.avf;if(!Array.isArray(f.matCli))f.matCli=[];if(!f.itens.length)f.itens.push(['',1,'']);
 const fi=(k,l,t='text',ph='',ex='')=>`<label class="field"><span>${l}</span><input data-avf="${k}" type="${t}" value="${esc(f[k])}" placeholder="${ph}" ${ex}></label>`;
 const rowN=(it,i)=>`<div class="itm"><input data-avi="itens|${i}|0" value="${esc(it[0])}" placeholder="Ex.: Disjuntor 20 A" aria-label="Material"><input data-avi="itens|${i}|1" type="number" min="0" step="1" value="${esc(it[1])}" aria-label="Quantidade"><input data-avi="itens|${i}|2" type="number" min="0" step="0.01" value="${esc(it[2])}" placeholder="0,00" aria-label="Valor unitário"><button type="button" class="iconbtn sm" data-act="avItemMove" data-arg="itens|${i}" title="Passar para conta do cliente" aria-label="Passar para conta do cliente">${ic('swap',16)}</button><button type="button" class="iconbtn sm" data-act="avItemDel" data-arg="itens|${i}" aria-label="Remover">${ic('trash',16)}</button></div>`;
 const rowC=(it,i)=>`<div class="itm c"><input data-avi="matCli|${i}|0" value="${esc(it[0])}" placeholder="Ex.: Chuveiro 7500 W 220 V" aria-label="Material"><input data-avi="matCli|${i}|1" type="number" min="0" step="1" value="${esc(it[1])}" aria-label="Quantidade"><button type="button" class="iconbtn sm" data-act="avItemMove" data-arg="matCli|${i}" title="Passar para nossa conta" aria-label="Passar para nossa conta">${ic('swap',16)}</button><button type="button" class="iconbtn sm" data-act="avItemDel" data-arg="matCli|${i}" aria-label="Remover">${ic('trash',16)}</button></div>`;
 return {title:id==='new'?'Novo orçamento':'Editar orçamento',html:`
 <div class="card pad" style="max-width:760px">
  <h3 class="sec-title">Solicitante</h3>
  <div class="field"><span>Quem solicita</span><div class="seg"><button type="button" class="${!f.cli?'on':''}" data-act="avQuem" data-arg="avulso">Pessoa sem plano</button><button type="button" class="${f.cli?'on':''}" data-act="avQuem" data-arg="cliente">Cliente cadastrado</button></div></div>
  ${f.cli?`<label class="field"><span>Cliente</span><select id="avCli">${cliOpts(f.cli)}</select><small>Os dados abaixo vêm da ficha. O serviço aparece como “Serviço extra” e o valor entra no financeiro do cliente.</small></label>`:''}
  <div class="grid2" style="gap:0 14px">${fi('nome','Nome','text','Nome completo')}${fi('tel','Telefone / WhatsApp','tel','(11) 90000-0000')}${fi('email','E-mail','email','email@exemplo.com')}<label class="field"><span>Tipo de imóvel</span><select data-avf="cat">${opt(SEGMENTOS,f.cat)}</select></label></div>
  ${fi('end','Endereço do serviço','text','Rua, número, bairro, cidade')}
  <h3 class="sec-title">Serviço</h3>
  <label class="field"><span>Descrição do serviço</span><textarea data-avf="desc" placeholder="O que será feito">${esc(f.desc)}</textarea></label>
  <h3 class="sec-title">Materiais por nossa conta</h3>
  <p class="muted" style="margin:-4px 0 10px;font-size:13px">Nós compramos. Aparecem com preço e entram no valor do orçamento.</p>
  <div class="itm itm-h"><span>Material</span><span>Qtd.</span><span>Valor unit.</span><span></span><span></span></div>
  ${f.itens.map(rowN).join('')}
  <button type="button" class="btn ghost sm" data-act="avItemAdd" data-arg="itens">${ic('plus',16)}Adicionar material</button>
  <h3 class="sec-title">Materiais por conta do cliente</h3>
  <p class="muted" style="margin:-4px 0 10px;font-size:13px">O cliente compra. Viram uma lista sem preço e não entram no valor do orçamento. Use ${ic('swap',14,'')} para mudar um material de lista.</p>
  ${f.matCli.length?`<div class="itm c itm-h"><span>Material</span><span>Qtd.</span><span></span><span></span></div>${f.matCli.map(rowC).join('')}`:''}
  <button type="button" class="btn ghost sm" data-act="avItemAdd" data-arg="matCli">${ic('plus',16)}Adicionar material do cliente</button>
  <h3 class="sec-title">Valores e prazo</h3>
  <div class="grid2" style="gap:0 14px">${fi('mao','Mão de obra (R$)','number','0,00','min="0" step="0.01"')}${fi('descto','Desconto (R$)','number','0,00','min="0" step="0.01"')}${fi('prazo','Prazo de execução','date')}${fi('validade','Validade do orçamento (dias)','number','15','min="1" step="1"')}</div>
  <div class="totals" id="avTot">${avTotHtml(f)}</div>
  <label class="field" style="margin-top:14px"><span>Observações</span><textarea data-avf="obs" placeholder="Condições, garantia, prazos">${esc(f.obs)}</textarea></label>
  <div class="actions"><button class="btn ghost" data-act="avCancel">Cancelar</button><button class="btn" data-act="avSave">${ic('check',18)}Salvar</button></div>
 </div>`};
};
VIEWS.avulso=id=>{
 const a=avBy(id);if(!a)return {title:'Orçamento',html:'<div class="card empty">Orçamento não encontrado.</div>'};
 const v=a.visita&&visBy(a.visita),c=a.cli&&cli(a.cli),mc=matsCli(a);
 const ST=['Em aberto','Aprovado','Recusado','Concluído'];
 return {title:'Orçamento de serviço',html:`
 <div class="grid2">
  <div class="stack">
   <section class="card"><div class="row" style="border:0;padding:18px">${c?`<span class="thumb">${pic(c)}</span>`:`<span class="ini">${iniciais(a.nome)}</span>`}<span class="grow"><b style="font-size:17px">${esc(a.nome)}</b><small>Orçamento nº ${avNum(a)}, criado em ${dmy(a.criado)}</small>${c?`<small><button class="link" data-go="cliente:${c.id}">Ver ficha do cliente</button></small>`:''}</span><span class="pills">${pill(avTag(a))}${pill(a.status)}</span></div>
    <div class="pad" style="padding-top:0"><div class="contact"><a href="tel:${(a.tel||'').replace(/\D/g,'')}">${ic('phone',18)}${esc(a.tel||'—')}</a>${a.email?`<a href="mailto:${esc(a.email)}">${ic('mail',18)}${esc(a.email)}</a>`:''}<span>${ic('pin',18)}${esc(a.end||'—')}</span><span>${ic('home',18)}${esc(a.cat)}</span></div></div>
   </section>
   <section class="card"><h3>Status do orçamento</h3><div class="pad" style="padding-top:0"><div class="seg">${ST.map(s=>`<button class="${a.status===s?'on':''}" data-act="avStatus" data-arg="${id}|${s}">${s}</button>`).join('')}</div>

/* financeiro */
VIEWS.financeiro=()=>{
 const tabs=[['geral','Visão geral'],['cliente','Por cliente'],['despesas','Despesas']];
 const rec=receitas(),gas=gastos(),R=soma(rec),G=soma(gas);
 let body='';
 if(S.finTab==='geral'){
  const cats=['Materiais','Deslocamento','Equipamentos','Outros'],cor=['var(--blue)','var(--brand)','var(--amber)','var(--red)'];
  const parts=cats.map((k,i)=>{const v=soma(gas.filter(g=>g.cat===k));return {l:k,v,c:cor[i],txt:(G?Math.round(v/G*100):0)+'%'}});
  const hist=[5,4,3,2,1,0].map(i=>{const m=addM(mesAtual()+'-01',-i).slice(0,7);return [mesNome(m).slice(0,3),i?soma(receitas(m))-soma(gastos(m)):R-G]});const mx=Math.max(1,...hist.map(h=>h[1]));
  const curto=v=>Math.abs(v)>=1000?(v/1000).toFixed(1).replace('.',',')+' mil':'R$ '+Math.round(v);
  const top=porCliente().slice(0,3);
  const aRec=rec.filter(r=>!r.pago&&r.cli);
  const avR=rec.filter(r=>r.av&&!r.cli);
  body=`<div class="kpis k3">
   <div class="card kpi"><span><small>Receita</small><strong class="pos" style="font-size:22px">${brl(R)}</strong></span></div>
   <div class="card kpi"><span><small>Despesas</small><strong class="neg" style="font-size:22px">${brl(G)}</strong></span></div>
   <div class="card kpi"><span><small>Lucro</small><strong style="font-size:22px">${brl(R-G)}</strong></span></div></div>
  <div class="grid2">
   <section class="card"><h3>Gastos por categoria</h3><div class="chartrow">${donut(parts,120,20)}${legend(parts)}</div></section>
   <section class="card"><h3>Lucro nos últimos 6 meses</h3><div class="bars">${hist.map((h,i)=>`<div class="${i===5?'cur':''}"><small style="font-weight:700;color:var(--text)">${curto(h[1])}</small><i style="height:${Math.max(0,h[1])/mx*100}px;min-height:${h[1]>0?4:0}px"></i>${h[0]}</div>`).join('')}</div><div style="height:14px"></div></section>
   <section class="card"><h3>Clientes mais lucrativos <button class="link" data-act="setF" data-arg="finTab|cliente">Ver todos</button></h3>${top.map(t=>`<button class="row" data-go="cliente:${t.c.id}"><span class="thumb" style="width:40px;height:40px;border-radius:50%">${pic(t.c)}</span><span class="grow"><b>${esc(t.c.nome)}</b></span><b class="pos">${brl(t.l)}</b></button>`).join('')}
    ${avR.length?`<div class="row" style="background:var(--surface2)"><span class="grow"><b>Serviços avulsos concluídos</b><small>${avR.length} ${avR.length>1?'serviços':'serviço'} no mês</small></span><b class="pos">${brl(soma(avR))}</b></div>`:''}</section>
   <section class="card"><h3>A receber</h3>${aRec.map(r=>`<button class="row" data-act="pagar" data-arg="${r.cli}"><span class="grow"><b>${esc(cli(r.cli).nome)}</b><small>${esc(r.desc)}, vence dia ${dm(r.data)}</small></span><span class="pills"><b class="neg">${brl(r.valor)}</b>${pill(ctBy(r.cli).pag)}</span></button>`).join('')||'<div class="empty">Nada pendente ou em atraso.</div>'}<div class="pad" style="padding-top:8px"><button class="btn ghost block" data-act="cobrar">${ic('send',18)}Enviar lembrete de pagamento</button></div></section>
  </div>`;
 }
 if(S.finTab==='cliente'){const l=porCliente();body=`<div class="card tscroll"><table class="table"><thead><tr><th>Cliente</th><th class="n">Receita</th><th class="n">Custo</th><th class="n">Lucro</th><th class="n">Pagamento</th></tr></thead><tbody>${l.map(t=>`<tr><td><button class="link" style="color:var(--text);font-weight:600" data-go="cliente:${t.c.id}">${esc(t.c.nome)}</button></td><td class="n">${brl(t.r)}</td><td class="n">${brl(t.g)}</td><td class="n ${t.l>=0?'pos':'neg'}">${brl(t.l)}</td><td class="n"><button data-act="pagar" data-arg="${t.c.id}" aria-label="Alterar pagamento">${pill(ctBy(t.c.id).pag)}</button></td></tr>`).join('')}</tbody></table></div><p class="muted" style="font-size:13px">O custo soma materiais das OS e quilometragem ao valor de ${brl(CFG.km)} por km. Toque no status de pagamento para alterar.</p>`}
 if(S.finTab==='despesas'){body=`<div class="card list">${gas.slice().sort((a,b)=>b.data.localeCompare(a.data)).map(g=>`<div class="row"><b style="width:44px">${dm(g.data)}</b><span class="grow"><b>${esc(g.desc)}</b><small>${g.cat}${g.auto?', calculado pelos deslocamentos':''}</small></span><b class="neg">${brl(g.valor)}</b>${g.id&&despesas.includes(g)?`<button class="iconbtn sm" data-act="delLanc" data-arg="desp|${g.id}" aria-label="Excluir lançamento" title="Excluir">${ic('trash',16)}</button>`:'<span style="width:32px;flex:none"></span>'}</div>`).join('')}</div><p class="muted" style="font-size:13px">Materiais das OS e deslocamentos entram sozinhos; para tirá-los, exclua o material na OS ou o deslocamento.</p><div class="actions"><button class="btn" data-act="addDesp">${ic('plus',18)}Lançar despesa</button></div>`}
 return {title:'Financeiro',html:`
 <div class="card" style="margin-bottom:16px"><div class="tabs">${tabs.map(t=>`<button class="tab ${S.finTab===t[0]?'on':''}" data-act="setF" data-arg="finTab|${t[0]}">${t[1]}</button>`).join('')}<span style="margin-left:auto;align-self:center;font-size:13px;color:var(--muted);padding-right:10px;white-space:nowrap">${mesLabel(mesAtual())}</span></div></div>
 ${body}`};
};

/* horas */
VIEWS.horas=()=>{
 const days=Array.from({length:7},(_,i)=>addD(HOJE,i-6));
 const vals=days.map(d=>horas.filter(h=>h.data===d).reduce((s,h)=>s+h.h,0));
 const mx=Math.max(...vals,1),tot=vals.reduce((s,v)=>s+v,0);
 const run=S.timer;
 const abertas=os.filter(o=>o.status!=='Concluída');
 return {title:'Horas trabalhadas',html:`
 <div class="grid2">
  <section class="card"><h3>Cronômetro</h3>
   <div class="timer" style="padding-top:4px"><span class="grow"><small>${run?'Em andamento: OS '+osNum(run.os)+', '+esc(cli(osBy(run.os).cli).nome):'Nenhum atendimento em andamento'}</small><strong id="timerTxt">${run?fh((Date.now()-run.t0)/3.6e6):'0h00'}</strong></span>
   ${run?`<button class="btn danger" data-act="timer" data-arg="${run.os}">${ic('stop',18)}Parar</button>`:''}</div>
   ${run?'':abertas.length?`<div class="pad" style="padding-top:0"><label class="field"><span>Atendimento</span><select id="timerOS">${abertas.map(o=>`<option value="${o.id}">OS ${osNum(o.id)}, ${esc(cli(o.cli).nome)}</option>`).join('')}</select></label><button class="btn block" data-act="timerSel">${ic('play',18)}Iniciar</button></div>`:'<div class="empty">Nenhuma OS aberta.</div>'}

 <label class="field" id="aMw" ${precisaMotivo(tv)?'':'hidden'}><span>Motivo da solicitação</span><textarea id="aM" rows="3" placeholder="Descreva o problema relatado pelo cliente">${esc(v?.motivo||'')}</textarea></label>`;

function salvarVisita(v){
 const d=$('#aD').value,h=$('#aH').value||'09:00';
 if(!d){toast('Escolha a data');return false}
 if(v?.avulso){v.data=d;v.hora=h;render();toast('Visita remarcada para '+dmy(d));return}
 const tv=$('#aT').value,[tipo,ciclo]=tv.split(':'),motivo=($('#aM')?.value||'').trim();
 if(precisaMotivo(tipo)&&!motivo){toast('Informe o motivo da solicitação');$('#aM').focus();return false}
 const dados={data:d,hora:h,tipo,ciclo:tipo==='Preventiva'?ciclo:undefined,motivo:precisaMotivo(tipo)?motivo:''};
 if(v){
  if(!v.os)v.cli=$('#aC').value;
  Object.assign(v,dados);
  if(v.os){const o=osBy(v.os);o.data=d;o.hora=h;o.motivo=dados.motivo;if(o.status==='Agendada'&&(o.tipo!==tipo||o.ciclo!==dados.ciclo)){o.tipo=tipo;o.ciclo=dados.ciclo;o.itens=[...itensPara(v)];o.chk=o.itens.map(()=>0)}}
  render();toast('Visita atualizada');
 }else{
  visitas.push({id:uid('v'),cli:$('#aC').value,...dados});
  if(S.route==='agenda'&&d>=HOJE&&d<=addD(HOJE,6))S.agDay=d;
  render();toast('Visita agendada para '+dmy(d));
 }
}

/* assinatura */
function initSig(){
 const cv=$('#sigPad');if(!cv)return;
 const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
 cv.width=r.width*dpr;cv.height=r.height*dpr;
 const x=cv.getContext('2d');x.scale(dpr,dpr);x.lineWidth=2.4;x.lineCap='round';x.lineJoin='round';x.strokeStyle=getComputedStyle(document.body).color;
 let dn=false,drew=false;
 const p=e=>{const b=cv.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top]};
 cv.onpointerdown=e=>{dn=true;cv.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(...p(e))};
 cv.onpointermove=e=>{if(!dn)return;x.lineTo(...p(e));x.stroke();drew=true};
 cv.onpointerup=()=>{dn=false};
 S.sig={cv,x,has:()=>drew,clear:()=>{x.clearRect(0,0,cv.width,cv.height);drew=false}};
}

/* ---------- nuvem: Firebase (login + sincronização + backup automático) ---------- */
const CLOUD={auth:null,db:null,user:null,ready:false,timer:null,saving:false,again:false,sent:{},seq:0,unsub:null,device:(()=>{try{let d=localStorage.getItem('cj-dispositivo');if(!d){d=uid('d');localStorage.setItem('cj-dispositivo',d)}return d}catch(e){return uid('d')}})(),st:'off',msg:'',lastOk:0};
const cref=()=>CLOUD.db.collection('empresas').doc(EMPRESA_ID);
function loadScript(src){return new Promise((ok,err)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=err;document.head.appendChild(s)})}
function setCloud(st,msg){
 CLOUD.st=st;CLOUD.msg=msg||'';const el=$('#cloudSt');if(!el)return;
 if(!FB_ON){el.hidden=true;return}
 el.hidden=false;el.className='cloud '+st;
 const t={ok:'Salvo na nuvem',saving:'Salvando…',offline:'Offline: salvo no aparelho',err:msg||'Erro ao salvar',off:'Desconectado'}[st]||'';
 el.innerHTML=`${ic(st==='err'?'alert':'cloud',18)}<span>${t}</span>`;el.title=t;
}
function primeSent(){CLOUD.sent={cfg:JSON.stringify(CFG)};for(const k in DATA)CLOUD.sent[k]=JSON.stringify(DATA[k])}
function cloudSchedule(){if(!CLOUD.user||!CLOUD.ready)return;clearTimeout(CLOUD.timer);setCloud(navigator.onLine?'saving':'offline');CLOUD.timer=setTimeout(()=>cloudSave(),1200)}
async function cloudSave(force){
 if(!CLOUD.user||!CLOUD.ready)return;
 clearTimeout(CLOUD.timer);
 if(CLOUD.saving){CLOUD.again=true;return}
 CLOUD.saving=true;setCloud(navigator.onLine?'saving':'offline');
 const at=Date.now(),R=cref(),b=CLOUD.db.batch(),por=CLOUD.user.email||'';
 const parts={cfg:JSON.stringify(CFG)};for(const k in DATA)parts[k]=JSON.stringify(DATA[k]);
 try{
  for(const k in parts){if(force||CLOUD.sent[k]!==parts[k]){if(parts[k].length>1e6)throw {code:'grande',k};b.set(R.collection('dados').doc(k),{json:parts[k],em:at,por})}}
  const full=JSON.stringify({d:DATA,cfg:CFG}),bk={};
  if(full.length<1e6){
   CLOUD.seq++;const rs='r'+(CLOUD.seq%30),ds='d'+(Math.floor(at/864e5)%30),info={em:at,por,tamanho:full.length};
   b.set(R.collection('backups').doc(rs),{...info,tipo:'A cada alteração',json:full});
   b.set(R.collection('backups').doc(ds),{...info,tipo:'Diário',json:full});
   bk[rs]={...info,tipo:'A cada alteração'};bk[ds]={...info,tipo:'Diário'};
  }
  b.set(R,{atualizado:at,dispositivo:CLOUD.device,por,empresa:CFG.empresa,seq:CLOUD.seq,backups:bk},{merge:true});
  Object.assign(CLOUD.sent,parts);
  await b.commit();
  setMeta({pend:false,syncedAt:at});CLOUD.lastOk=at;
  setCloud(full.length<1e6?'ok':'err',full.length<1e6?'':'Dados grandes demais para o backup');
 }catch(e){
  console.error(e);CLOUD.sent={};
  if(e.code==='permission-denied')setCloud('err','Sem permissão no Firebase');
  else if(e.code==='grande'){setCloud('err','Dados grandes demais');toast('Não foi possível salvar na nuvem: os dados de '+e.k+' passaram do limite')}
  else setCloud('err');
 }finally{CLOUD.saving=false;if(CLOUD.again){CLOUD.again=false;cloudSave()}}
}
async function cloudPull(at){
 const q=await cref().collection('dados').get();const s={d:{},cfg:{}};
 q.forEach(doc=>{try{const j=JSON.parse(doc.data().json);if(doc.id==='cfg')s.cfg=j;else s.d[doc.id]=j}catch(e){}});
 if(!Object.keys(s.d).length)return false;
 applyStored(s);applyTheme();applyPal();
 lastJSON=JSON.stringify({d:DATA,cfg:CFG});try{localStorage.setItem(STORE,lastJSON)}catch(e){}
 setMeta({pend:false,syncedAt:at||Date.now(),at:at||Date.now()});primeSent();return true;
}
async function startSync(){
 setCloud('saving');
 try{
  const m=await cref().get(),md=m.exists?m.data():null,cAt=md?.atualizado||0,lm=lmeta();
  CLOUD.seq=md?.seq||0;
  if(!md){CLOUD.ready=true;cloudSave(true)}
  else if(lm.pend&&(lm.at||0)>cAt){CLOUD.ready=true;cloudSave(true)}
  else if(cAt!==(lm.syncedAt||0)){await cloudPull(cAt);CLOUD.ready=true;setCloud('ok')}
  else{CLOUD.ready=true;primeSent();setCloud('ok')}
  if(!Object.keys(CLOUD.sent).length)primeSent();
  CLOUD.unsub&&CLOUD.unsub();
  CLOUD.unsub=cref().onSnapshot(doc=>{
   if(!doc.exists||doc.metadata.hasPendingWrites)return;
   const x=doc.data(),lm=lmeta();
   if(x.dispositivo===CLOUD.device||(x.atualizado||0)<=(lm.syncedAt||0)||lm.pend||CLOUD.saving)return;
   cloudPull(x.atualizado).then(ok=>{if(ok){render();toast('Dados atualizados de outro aparelho')}}).catch(()=>{});
  },e=>{if(e.code==='permission-denied')setCloud('err','Sem permissão no Firebase')});
  return true;
 }catch(e){
  if(e.code==='permission-denied'){showLogin('semacesso');return false}
  CLOUD.ready=true;setCloud('offline');window.addEventListener('online',()=>startSync(),{once:true});return true;
 }
}
function stopSync(){CLOUD.unsub&&CLOUD.unsub();CLOUD.unsub=null;CLOUD.ready=false;clearTimeout(CLOUD.timer)}
window.addEventListener('online',()=>{if(CLOUD.user&&CLOUD.ready&&lmeta().pend)cloudSave()});
window.addEventListener('offline',()=>{if(CLOUD.user)setCloud('offline')});

  ${LG.err?`<div class="login-err">${esc(LG.err)}</div>`:''}${LG.ok?`<div class="login-ok">${esc(LG.ok)}</div>`:''}
